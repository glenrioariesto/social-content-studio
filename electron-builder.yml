appId: com.glenrioariesto.socialcontentstudio
productName: Social Content Studio
directories:
  output: dist
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: binaries/win/
    to: bin/
    filter:
      - ffmpeg.exe
      - ffprobe.exe
      - yt-dlp.exe
win:
  target: nsis
  icon: build/icon.ico
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false
mac:
  identity: null
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
